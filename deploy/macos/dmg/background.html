<!doctype html>
<!--
  The window of MyInfra.dmg, behind the icons that the Finder places as said
  by layout.applescript. A mid stone keeps the names the Finder writes under the
  icons readable in black (light mode) and in white (dark mode). Rendered by
  deploy/macos/dmg/render.sh into background.png and background@2x.png.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    src: url("../../../web/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Geist", system-ui, sans-serif;
    color: #fafaf9;
    background:
      radial-gradient(ellipse 70% 80% at 50% 48%, #837b75 0%, #746d68 55%, #645e59 100%);
  }
  .head {
    position: absolute; top: 38px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; }
  .brand span { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .head p { margin: 0; font-size: 13.5px; color: rgba(250, 250, 249, 0.82); }
  /* The icons sit at x 170 and 490, y 190: the arrow joins them. */
  .arrow { position: absolute; left: 244px; top: 150px; width: 172px; height: 64px; }
  .foot {
    position: absolute; bottom: 30px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: rgba(250, 250, 249, 0.66);
  }
</style>
</head>
<body>
  <div class="head">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#1c1917"/>
        <g fill="#fafaf9" stroke="#1c1917" stroke-width="1.35" stroke-linejoin="round" transform="translate(4 4)">
          <path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/>
          <path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/>
          <path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/>
        </g>
      </svg>
      <span>MyInfra</span>
    </div>
    <p>Glissez MyInfra dans le dossier Applications</p>
  </div>
  <svg class="arrow" viewBox="0 0 172 64" fill="none" stroke="#fafaf9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 44C52 10 112 8 152 36" stroke-width="5"/>
    <path d="M134 38l20 0-4-19" stroke-width="5"/>
  </svg>
  <div class="foot">Puis ouvrez-le depuis Applications, le Launchpad ou Spotlight.</div>
</body>
</html>
