name: immich
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - ./hwaccel.yml:/usr/src/app/hwaccel.yml
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOSTNAME: database
      TZ: ${TZ}
      PUBLIC_URL: https://${DOMAIN:-photos.example.com}
    ports:
      - '2283:2283'
    depends_on: [redis, database]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2283/api/server/ping"]
  redis:
    image: docker.io/valkey/valkey:8-bookworm
    healthcheck:
      test: redis-cli ping || exit 1
  database:
    image: ghcr.io/immich-app/postgres:14
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=vectors.so", "-c", "search_path=\"$$user\", public"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
  machine-learning:
    build: ./ml
    env_file: .env
volumes:
  model-cache:
