services:
  hbbs:
    image: rustdesk/rustdesk-server:1.1.14
    command: hbbs
    volumes:
      - ./data:/root
    ports:
      - "21115-21116:21115-21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr
  hbbr:
    image: rustdesk/rustdesk-server:1.1.14
    command: hbbr
    volumes:
      - ./data:/root
    ports:
      - "21117:21117"
      - "21119:21119"
  db:
    image: postgres:16
    ports:
      - "5432:5432"
