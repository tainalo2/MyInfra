type: myinfra-package
version: 1
name: Memos
summary: Des notes courtes.
category: Collaboration
services:
  - name: memos
    image: neosmemo/memos:0.24.4
    public: true
    port: 5230
    volumes:
      - path: /var/opt/memos
        sizeGi: 2
about:
  site: https://www.usememos.com
  logo: memos
  description: Des notes courtes, datées, pour garder une trace au fil des jours. Les notes sont conservées.
  translations:
    de:
      summary: Kurze Notizen.
      description: Kurze, datierte Notizen, um die Tage festzuhalten. Die Notizen bleiben erhalten.
    en:
      summary: Short notes.
      description: Short, dated notes, to keep a trace through the days. The notes are kept.
    it:
      summary: Note brevi.
      description: Note brevi, datate, per tenere traccia dei giorni. Le note sono conservate.
    pt:
      summary: Notas curtas.
      description: Notas curtas, datadas, para guardar um rasto ao longo dos dias. As notas são conservadas.
