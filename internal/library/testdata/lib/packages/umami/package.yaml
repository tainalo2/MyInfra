type: myinfra-package
version: 1
name: Umami
summary: Une mesure d'audience sobre.
category: Sites
env:
  APP_SECRET: '{{secret:SECRET}}'
  DATABASE_URL: postgresql://umami:{{secret:DB}}@postgres:5432/umami
  POSTGRES_DB: umami
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: umami
services:
  - name: web
    image: umamisoftware/umami:postgresql-v2.17.0
    public: true
    port: 3000
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://umami.is
  logo: umami
  description: 'Une mesure d''audience légère : pages vues et origines, sans profil publicitaire. Les visites sont dans la base.'
  translations:
    de:
      summary: Eine nüchterne Reichweitenmessung.
      description: 'Eine leichte Reichweitenmessung: Seitenaufrufe und Herkunft, ohne Werbeprofil. Die Besuche liegen in der Datenbank.'
    en:
      summary: A quiet audience measure.
      description: 'A light audience measure: page views and origins, without an advertising profile. Visits are in the database.'
    it:
      summary: Una misura d'audience sobria.
      description: 'Una misura d''audience leggera: pagine viste e origini, senza profilo pubblicitario. Le visite stanno nel database.'
    pt:
      summary: Uma medida de audiência sóbria.
      description: 'Uma medida de audiência leve: páginas vistas e origens, sem perfil publicitário. As visitas estão na base.'
