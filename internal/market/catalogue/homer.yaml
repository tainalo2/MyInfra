type: myinfra-package
version: 1
name: Homer
summary: Une page d'accueil simple.
category: Outils
services:
  - name: homer
    image: b4bz/homer:v25.5.2
    public: true
    port: 8080
    volumes:
      - path: /www/assets
        sizeGi: 1
about:
  site: https://github.com/bastienwirtz/homer
  logo: homer
  description: Une page d'accueil simple, faite d'une liste de services. La disposition est conservée.
  translations:
    de:
      summary: Eine einfache Startseite.
      description: Eine einfache Startseite aus einer Liste von Diensten. Die Anordnung bleibt erhalten.
    en:
      summary: A simple home page.
      description: A simple home page, made of a list of services. The layout is kept.
    it:
      summary: Una pagina iniziale semplice.
      description: Una pagina iniziale semplice, fatta di un elenco di servizi. La disposizione è conservata.
    pt:
      summary: Uma página de entrada simples.
      description: Uma página de entrada simples, feita de uma lista de serviços. A disposição é conservada.
