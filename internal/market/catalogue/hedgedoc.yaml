type: myinfra-package
version: 1
name: HedgeDoc
summary: Des notes en markdown.
category: Collaboration
env:
  CMD_DB_URL: postgres://hedgedoc:{{secret:DB}}@postgres:5432/hedgedoc
  CMD_DOMAIN: '{{host}}'
  CMD_PROTOCOL_USESSL: "true"
  CMD_URL_ADDPORT: "false"
  POSTGRES_DB: hedgedoc
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: hedgedoc
services:
  - name: web
    image: quay.io/hedgedoc/hedgedoc:1.10.3
    public: true
    port: 3000
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://hedgedoc.org
  logo: hedgedoc
  description: Des notes en markdown, publiées ou gardées pour soi. Les notes sont dans la base.
  translations:
    de:
      summary: Notizen in Markdown.
      description: Notizen in Markdown, veröffentlicht oder für sich behalten. Die Notizen liegen in der Datenbank.
    en:
      summary: Notes in Markdown.
      description: Notes in Markdown, published or kept for yourself. The notes are in the database.
    it:
      summary: Note in markdown.
      description: Note in markdown, pubblicate o tenute per sé. Le note stanno nel database.
    pt:
      summary: Notas em markdown.
      description: Notas em markdown, publicadas ou guardadas para si. As notas estão na base.
