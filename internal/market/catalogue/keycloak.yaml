type: myinfra-package
version: 1
name: Keycloak
summary: Un service d'identité.
category: Identité
env:
  KC_BOOTSTRAP_ADMIN_PASSWORD: '{{secret:ADMIN}}'
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_DB: postgres
  KC_DB_PASSWORD: '{{secret:DB}}'
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
  KC_DB_USERNAME: keycloak
  KC_HOSTNAME: '{{host}}'
  KC_HTTP_ENABLED: "true"
  KC_PROXY_HEADERS: xforwarded
  POSTGRES_DB: keycloak
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: keycloak
services:
  - name: web
    image: keycloak/keycloak:26.3
    public: true
    port: 8080
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://www.keycloak.org
  logo: keycloak
  description: Un service d'identité pour connecter des applications avec les mêmes comptes. Les comptes sont dans la base.
  translations:
    de:
      summary: Ein Identitätsdienst.
      description: Ein Identitätsdienst, um Anwendungen mit denselben Konten zu verbinden. Die Konten liegen in der Datenbank.
    en:
      summary: An identity service.
      description: An identity service for connecting applications with the same accounts. Accounts are in the database.
    it:
      summary: Un servizio d'identità.
      description: Un servizio d'identità per collegare applicazioni con gli stessi account. Gli account stanno nel database.
    pt:
      summary: Um serviço de identidade.
      description: Um serviço de identidade para ligar aplicações com as mesmas contas. As contas estão na base.
