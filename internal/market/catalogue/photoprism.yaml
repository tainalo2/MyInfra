type: myinfra-package
version: 1
name: PhotoPrism
summary: Une photothèque.
category: Médias
env:
  MARIADB_DATABASE: photoprism
  MARIADB_PASSWORD: '{{secret:DB}}'
  MARIADB_ROOT_PASSWORD: '{{secret:ROOT}}'
  MARIADB_USER: photoprism
  PHOTOPRISM_ADMIN_PASSWORD: '{{secret:ADMIN}}'
  PHOTOPRISM_ADMIN_USER: admin
  PHOTOPRISM_DATABASE_DRIVER: mysql
  PHOTOPRISM_DATABASE_NAME: photoprism
  PHOTOPRISM_DATABASE_PASSWORD: '{{secret:DB}}'
  PHOTOPRISM_DATABASE_SERVER: mariadb:3306
  PHOTOPRISM_DATABASE_USER: photoprism
  PHOTOPRISM_ORIGINALS_LIMIT: "10000"
  PHOTOPRISM_SITE_URL: '{{url}}'
services:
  - name: web
    image: photoprism/photoprism:240915-ce
    public: true
    port: 2342
    volumes:
      - path: /photoprism/storage
        sizeGi: 32
  - name: mariadb
    image: mariadb:11
    port: 3306
    volumes:
      - path: /var/lib/mysql
        sizeGi: 8
about:
  site: https://www.photoprism.app
  logo: photoprism
  description: Une photothèque avec albums et recherche. Les photos et leur index sont conservés.
  translations:
    de:
      summary: Eine Fotothek.
      description: Eine Fotothek mit Alben und Suche. Fotos und ihr Index bleiben erhalten.
    en:
      summary: A photo library.
      description: A photo library with albums and search. Photos and their index are kept.
    it:
      summary: Una fototeca.
      description: Una fototeca con album e ricerca. Le foto e il loro indice sono conservati.
    pt:
      summary: Uma fototeca.
      description: Uma fototeca com álbuns e pesquisa. As fotos e o seu índice são conservados.
