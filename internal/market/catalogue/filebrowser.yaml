type: myinfra-package
version: 1
name: File Browser
summary: Les fichiers d'un dossier, dans le navigateur.
category: Fichiers et tableaux
services:
  - name: filebrowser
    image: filebrowser/filebrowser:v2.32.0
    public: true
    port: 80
    volumes:
      - path: /srv
        sizeGi: 16
about:
  site: https://filebrowser.org
  logo: filebrowser
  description: Les fichiers d'un dossier, parcourus et déposés depuis le navigateur. Le dossier est conservé.
  translations:
    de:
      summary: Die Dateien eines Ordners, im Browser.
      description: Die Dateien eines Ordners, durchsucht und abgelegt aus dem Browser. Der Ordner bleibt erhalten.
    en:
      summary: The files of a folder, in the browser.
      description: The files of a folder, browsed and uploaded from the browser. The folder is kept.
    it:
      summary: I file di una cartella, nel browser.
      description: I file di una cartella, percorsi e depositati dal browser. La cartella è conservata.
    pt:
      summary: Os ficheiros de uma pasta, no navegador.
      description: Os ficheiros de uma pasta, percorridos e depositados a partir do navegador. A pasta é conservada.
