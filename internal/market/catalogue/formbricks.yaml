type: myinfra-package
version: 1
name: Formbricks
summary: Des formulaires et des enquêtes.
category: Échanges
inputs:
  - key: email
    label: Adresse de contact
env:
  DATABASE_URL: postgresql://formbricks:{{secret:DB}}@postgres:5432/formbricks
  ENCRYPTION_KEY: '{{secret:ENC}}'
  MAIL_FROM: '{{input:email}}'
  NEXTAUTH_SECRET: '{{secret:SECRET}}'
  NEXTAUTH_URL: '{{url}}'
  POSTGRES_DB: formbricks
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: formbricks
  WEBAPP_URL: '{{url}}'
services:
  - name: web
    image: ghcr.io/formbricks/formbricks:3.3.3
    public: true
    port: 3000
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://formbricks.com
  logo: formbricks
  description: Des formulaires et des enquêtes, avec les réponses au même endroit. Les réponses sont dans la base.
  translations:
    de:
      summary: Formulare und Umfragen.
      description: Formulare und Umfragen, mit den Antworten an einem Ort. Die Antworten liegen in der Datenbank.
    en:
      summary: Forms and surveys.
      description: Forms and surveys, with the answers in one place. The answers are in the database.
    it:
      summary: Moduli e sondaggi.
      description: Moduli e sondaggi, con le risposte nello stesso posto. Le risposte stanno nel database.
    pt:
      summary: Formulários e inquéritos.
      description: Formulários e inquéritos, com as respostas no mesmo sítio. As respostas estão na base.
