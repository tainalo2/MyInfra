type: myinfra-package
version: 1
name: Firefly III
summary: Un suivi des comptes et des dépenses.
category: Comptes personnels
env:
  APP_KEY: base64:{{encoded:KEY}}
  APP_URL: '{{url}}'
  DB_CONNECTION: pgsql
  DB_DATABASE: firefly
  DB_HOST: postgres
  DB_PASSWORD: '{{secret:DB}}'
  DB_PORT: "5432"
  DB_USERNAME: firefly
  POSTGRES_DB: firefly
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: firefly
  TRUSTED_PROXIES: '*'
services:
  - name: web
    image: fireflyiii/core:version-6.2.16
    public: true
    port: 8080
    volumes:
      - path: /var/www/html/storage
        sizeGi: 4
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://www.firefly-iii.org
  logo: fireflyiii
  description: Un suivi des comptes, des dépenses et des budgets. Les opérations sont dans la base.
  translations:
    de:
      summary: Eine Übersicht der Konten und Ausgaben.
      description: Eine Übersicht der Konten, Ausgaben und Budgets. Die Buchungen liegen in der Datenbank.
    en:
      summary: A record of accounts and spending.
      description: A record of accounts, spending, and budgets. The operations are in the database.
    it:
      summary: Un seguito di conti e spese.
      description: Un seguito di conti, spese e budget. Le operazioni stanno nel database.
    pt:
      summary: Um seguimento das contas e das despesas.
      description: Um seguimento das contas, das despesas e dos orçamentos. As operações estão na base.
