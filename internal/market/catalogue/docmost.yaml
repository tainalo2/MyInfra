type: myinfra-package
version: 1
name: Docmost
summary: Un espace de pages d'équipe.
category: Collaboration
env:
  APP_SECRET: '{{secret:SECRET}}'
  APP_URL: '{{url}}'
  DATABASE_URL: postgresql://docmost:{{secret:DB}}@postgres:5432/docmost
  POSTGRES_DB: docmost
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: docmost
  REDIS_URL: redis://redis:6379
services:
  - name: web
    image: docmost/docmost:0.21.0
    public: true
    port: 3000
    volumes:
      - path: /app/data
        sizeGi: 8
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://docmost.com
  logo: docmost
  description: Des pages d'équipe, organisées en espaces, pour documenter un projet. Les pages sont dans la base.
  translations:
    de:
      summary: Ein Raum für Teamseiten.
      description: Teamseiten, in Räumen geordnet, um ein Projekt zu dokumentieren. Die Seiten liegen in der Datenbank.
    en:
      summary: A space of team pages.
      description: Team pages, organised in spaces, to document a project. The pages are in the database.
    it:
      summary: Uno spazio di pagine di squadra.
      description: Pagine di squadra, organizzate in spazi, per documentare un progetto. Le pagine stanno nel database.
    pt:
      summary: Um espaço de páginas de equipa.
      description: Páginas de equipa, organizadas em espaços, para documentar um projeto. As páginas estão na base.
