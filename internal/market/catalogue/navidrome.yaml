type: myinfra-package
version: 1
name: Navidrome
summary: Une discothèque.
category: Médias
env:
  ND_DATAFOLDER: /data
  ND_MUSICFOLDER: /data/music
services:
  - name: navidrome
    image: deluan/navidrome:0.55.2
    public: true
    port: 4533
    volumes:
      - path: /data
        sizeGi: 16
about:
  site: https://www.navidrome.org
  logo: navidrome
  description: Une discothèque accessible depuis le navigateur et les applications compatibles. La musique et l'écoute sont conservées.
  translations:
    de:
      summary: Eine Plattensammlung.
      description: Eine Plattensammlung aus dem Browser und kompatiblen Anwendungen. Musik und Hörverlauf bleiben erhalten.
    en:
      summary: A record collection.
      description: A record collection from the browser and compatible applications. The music and the listening are kept.
    it:
      summary: Una discoteca.
      description: Una discoteca accessibile dal browser e dalle applicazioni compatibili. La musica e l'ascolto sono conservati.
    pt:
      summary: Uma discoteca.
      description: Uma discoteca acessível a partir do navegador e das aplicações compatíveis. A música e a escuta são conservadas.
