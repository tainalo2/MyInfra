type: myinfra-package
version: 1
name: Activepieces
summary: Des automatisations entre services.
category: Automatisation
env:
  AP_ENCRYPTION_KEY: '{{secret:KEY}}'
  AP_FRONTEND_URL: '{{url}}'
  AP_POSTGRES_DATABASE: activepieces
  AP_POSTGRES_HOST: postgres
  AP_POSTGRES_PASSWORD: '{{secret:DB}}'
  AP_POSTGRES_PORT: "5432"
  AP_POSTGRES_USERNAME: activepieces
  AP_REDIS_HOST: redis
  AP_REDIS_PORT: "6379"
  AP_WEBHOOK_URL: '{{url}}'
  POSTGRES_DB: activepieces
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: activepieces
services:
  - name: web
    image: activepieces/activepieces:0.48.2
    public: true
    port: 80
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://www.activepieces.com
  logo: activepieces
  description: Des automatisations visuelles entre des services. Les scénarios sont dans la base.
  translations:
    de:
      summary: Automatisierungen zwischen Diensten.
      description: Visuelle Automatisierungen zwischen Diensten. Die Abläufe liegen in der Datenbank.
    en:
      summary: Automations between services.
      description: Visual automations between services. The scenarios are in the database.
    it:
      summary: Automazioni tra servizi.
      description: Automazioni visive tra servizi. Gli scenari stanno nel database.
    pt:
      summary: Automatizações entre serviços.
      description: Automatizações visuais entre serviços. Os cenários estão na base.
