type: myinfra-package
version: 1
name: code-server
summary: Un éditeur dans le navigateur.
category: Code et données
env:
  PASSWORD: '{{secret:PASSWORD}}'
services:
  - name: code-server
    image: codercom/code-server:4.96.4
    public: true
    port: 8080
    volumes:
      - path: /home/coder/project
        sizeGi: 8
about:
  site: https://coder.com
  logo: coder
  description: Un éditeur de code ouvert dans le navigateur, sur les fichiers de la machine. Le dossier de travail est conservé.
  translations:
    de:
      summary: Ein Editor im Browser.
      description: Ein Code-Editor im Browser, auf den Dateien der Maschine. Der Arbeitsordner bleibt erhalten.
    en:
      summary: An editor in the browser.
      description: A code editor opened in the browser, on the machine's files. The working folder is kept.
    it:
      summary: Un editor nel browser.
      description: Un editor di codice aperto nel browser, sui file della macchina. La cartella di lavoro è conservata.
    pt:
      summary: Um editor no navegador.
      description: Um editor de código aberto no navegador, sobre os ficheiros da máquina. A pasta de trabalho é conservada.
