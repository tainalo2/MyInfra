type: myinfra-package
version: 1
name: Vikunja
summary: Des listes de tâches.
category: Collaboration
env:
  VIKUNJA_DATABASE_PATH: /app/vikunja/files/vikunja.db
  VIKUNJA_DATABASE_TYPE: sqlite
  VIKUNJA_SERVICE_PUBLICURL: '{{url}}'
services:
  - name: vikunja
    image: vikunja/vikunja:0.24.6
    public: true
    port: 3456
    volumes:
      - path: /app/vikunja/files
        sizeGi: 2
about:
  site: https://vikunja.io
  logo: vikunja
  description: Des listes et des tâches, avec des échéances et un partage. Les tâches sont conservées.
  translations:
    de:
      summary: Aufgabenlisten.
      description: Listen und Aufgaben, mit Fristen und Freigabe. Die Aufgaben bleiben erhalten.
    en:
      summary: Task lists.
      description: Lists and tasks, with due dates and sharing. The tasks are kept.
    it:
      summary: Liste di attività.
      description: Liste e attività, con scadenze e condivisione. Le attività sono conservate.
    pt:
      summary: Listas de tarefas.
      description: Listas e tarefas, com prazos e partilha. As tarefas são conservadas.
