type: myinfra-package
version: 1
name: Wiki.js
summary: Un wiki partagé.
category: Sites
env:
  DB_HOST: postgres
  DB_NAME: wiki
  DB_PASS: '{{secret:DB}}'
  DB_PORT: "5432"
  DB_TYPE: postgres
  DB_USER: wiki
  POSTGRES_DB: wiki
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: wiki
services:
  - name: web
    image: requarks/wiki:2
    public: true
    port: 3000
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://js.wiki
  logo: wikidotjs
  description: Un wiki pour écrire et relier des pages à plusieurs. Le contenu est rangé dans la base.
  translations:
    de:
      summary: Ein gemeinsames Wiki.
      description: Ein Wiki, um Seiten zu schreiben und zu verknüpfen. Der Inhalt liegt in der Datenbank.
    en:
      summary: A shared wiki.
      description: A wiki for writing and linking pages together. The content is stored in the database.
    it:
      summary: Un wiki condiviso.
      description: Un wiki per scrivere e collegare pagine in più persone. Il contenuto sta nel database.
    pt:
      summary: Um wiki partilhado.
      description: Um wiki para escrever e ligar páginas a várias pessoas. O conteúdo fica na base.
