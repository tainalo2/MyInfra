type: myinfra-package
version: 1
name: Lidarr
summary: Le suivi de la musique.
category: Médias
services:
  - name: lidarr
    image: linuxserver/lidarr:2.12.4
    public: true
    port: 8686
    volumes:
      - path: /config
        sizeGi: 8
about:
  site: https://lidarr.audio
  logo: lidarr
  description: 'Le suivi de la musique : artistes, albums, téléchargements et bibliothèque. La configuration et l''historique sont conservés.'
  translations:
    de:
      summary: Musik.
      description: 'Musik: Künstler, Alben, Downloads und Bibliothek. Konfiguration und Verlauf bleiben erhalten.'
    en:
      summary: Music.
      description: 'Music: artists, albums, downloads, and library. The configuration and history are kept.'
    it:
      summary: Musica.
      description: 'Musica: artisti, album, download e libreria. La configurazione e la cronologia sono conservate.'
    pt:
      summary: Música.
      description: 'Música: artistas, álbuns, descarregamentos e biblioteca. A configuração e o histórico são conservados.'
