type: myinfra-package
version: 1
name: Directus
summary: Une base de contenu.
category: Fichiers et tableaux
inputs:
  - key: email
    label: Adresse de contact
env:
  ADMIN_EMAIL: '{{input:email}}'
  ADMIN_PASSWORD: '{{secret:ADMIN}}'
  DB_CLIENT: pg
  DB_DATABASE: directus
  DB_HOST: postgres
  DB_PASSWORD: '{{secret:DB}}'
  DB_PORT: "5432"
  DB_USER: directus
  KEY: '{{secret:KEY}}'
  POSTGRES_DB: directus
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: directus
  PUBLIC_URL: '{{url}}'
  REDIS: redis://redis:6379
  SECRET: '{{secret:SECRET}}'
services:
  - name: web
    image: directus/directus:11.9.3
    public: true
    port: 8055
    volumes:
      - path: /directus/uploads
        sizeGi: 8
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://directus.io
  logo: directus
  description: Une base de contenu avec un écran d'administration et une API. Le contenu et les fichiers sont conservés.
  translations:
    de:
      summary: Eine Inhaltsdatenbank.
      description: Eine Inhaltsdatenbank mit einem Verwaltungsbildschirm und einer API. Inhalt und Dateien bleiben erhalten.
    en:
      summary: A content database.
      description: A content database with an admin screen and an API. Content and files are kept.
    it:
      summary: Un database di contenuti.
      description: Un database di contenuti con una schermata di amministrazione e un'API. Contenuti e file sono conservati.
    pt:
      summary: Uma base de conteúdo.
      description: Uma base de conteúdo com um ecrã de administração e uma API. O conteúdo e os ficheiros são conservados.
