type: myinfra-package
version: 1
name: WeKan
summary: Un tableau de cartes.
category: Collaboration
env:
  MONGO_INITDB_DATABASE: wekan
  MONGO_INITDB_ROOT_PASSWORD: '{{secret:DB}}'
  MONGO_INITDB_ROOT_USERNAME: wekan
  MONGO_URL: mongodb://wekan:{{secret:DB}}@mongo:27017/wekan?authSource=admin
  ROOT_URL: '{{url}}'
services:
  - name: web
    image: wekanteam/wekan:v7.72
    public: true
    port: 8080
    volumes:
      - path: /data
        sizeGi: 4
  - name: mongo
    image: mongo:7
    port: 27017
    volumes:
      - path: /data/db
        sizeGi: 8
about:
  site: https://wekan.github.io
  logo: wekan
  description: Un tableau de cartes pour suivre un travail d'une colonne à l'autre. Les cartes sont dans la base.
  translations:
    de:
      summary: Eine Tafel aus Karten.
      description: Eine Tafel aus Karten, um Arbeit von einer Spalte zur nächsten zu verfolgen. Die Karten liegen in der Datenbank.
    en:
      summary: A board of cards.
      description: A board of cards to follow work from one column to the next. The cards are in the database.
    it:
      summary: Una bacheca di schede.
      description: Una bacheca di schede per seguire un lavoro da una colonna all'altra. Le schede stanno nel database.
    pt:
      summary: Um quadro de cartões.
      description: Um quadro de cartões para seguir um trabalho de uma coluna à seguinte. Os cartões estão na base.
