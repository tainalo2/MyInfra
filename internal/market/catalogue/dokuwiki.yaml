type: myinfra-package
version: 1
name: DokuWiki
summary: Un wiki de fichiers, sans base à part.
category: Sites
services:
  - name: dokuwiki
    image: dokuwiki/dokuwiki:2024-02-06b
    public: true
    port: 80
    volumes:
      - path: /storage
        sizeGi: 2
about:
  site: https://www.dokuwiki.org
  logo: dokuwiki
  description: Un wiki dont chaque page est un fichier, sans base à part. Les pages restent sur le disque.
  translations:
    de:
      summary: Ein Datei-Wiki, ohne eigene Datenbank.
      description: Ein Wiki, in dem jede Seite eine Datei ist, ohne eigene Datenbank. Die Seiten bleiben auf der Platte.
    en:
      summary: A file wiki, with no separate database.
      description: A wiki where each page is a file, with no separate database. Pages stay on disk.
    it:
      summary: Un wiki di file, senza database a parte.
      description: Un wiki in cui ogni pagina è un file, senza database a parte. Le pagine restano sul disco.
    pt:
      summary: Um wiki de ficheiros, sem base à parte.
      description: Um wiki em que cada página é um ficheiro, sem base à parte. As páginas ficam no disco.
