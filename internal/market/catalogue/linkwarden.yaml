type: myinfra-package
version: 1
name: Linkwarden
summary: Des liens classés et conservés.
category: Notes et liens
env:
  DATABASE_URL: postgresql://linkwarden:{{secret:DB}}@postgres:5432/linkwarden
  NEXTAUTH_SECRET: '{{secret:SECRET}}'
  NEXTAUTH_URL: '{{url}}'
  POSTGRES_DB: linkwarden
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: linkwarden
services:
  - name: web
    image: ghcr.io/linkwarden/linkwarden:v2.10.2
    public: true
    port: 3000
    volumes:
      - path: /data
        sizeGi: 8
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://linkwarden.app
  logo: linkwarden
  description: Des liens classés en collections, avec une copie de la page. Les liens et les copies sont conservés.
  translations:
    de:
      summary: Sortierte und bewahrte Links.
      description: Links, in Sammlungen geordnet, mit einer Kopie der Seite. Links und Kopien bleiben erhalten.
    en:
      summary: Links sorted and kept.
      description: Links sorted into collections, with a copy of the page. Links and copies are kept.
    it:
      summary: Link ordinati e conservati.
      description: Link ordinati in raccolte, con una copia della pagina. Link e copie sono conservati.
    pt:
      summary: Ligações classificadas e conservadas.
      description: Ligações classificadas em coleções, com uma cópia da página. As ligações e as cópias são conservadas.
