type: myinfra-package
version: 1
name: ntfy
summary: Des notifications vers le téléphone.
category: Outils
env:
  NTFY_BASE_URL: '{{url}}'
services:
  - name: ntfy
    image: binwiederhier/ntfy:v2.14.0
    public: true
    port: 80
    args:
      - serve
    volumes:
      - path: /var/cache/ntfy
        sizeGi: 1
about:
  site: https://ntfy.sh
  logo: ntfy
  description: Des notifications publiées sur un sujet, reçues sur le téléphone ou le navigateur. Les messages récents sont conservés.
  translations:
    de:
      summary: Benachrichtigungen ans Telefon.
      description: Benachrichtigungen, die zu einem Thema veröffentlicht und auf dem Telefon oder im Browser empfangen werden. Die jüngsten Nachrichten bleiben erhalten.
    en:
      summary: Notifications to the phone.
      description: Notifications published on a topic, received on the phone or the browser. Recent messages are kept.
    it:
      summary: Notifiche verso il telefono.
      description: Notifiche pubblicate su un argomento, ricevute sul telefono o nel browser. I messaggi recenti sono conservati.
    pt:
      summary: Notificações para o telefone.
      description: Notificações publicadas num assunto, recebidas no telefone ou no navegador. As mensagens recentes são conservadas.
