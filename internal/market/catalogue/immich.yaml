type: myinfra-package
version: 1
name: Immich
summary: Une photothèque.
category: Médias
env:
  DB_DATABASE_NAME: immich
  DB_HOSTNAME: postgres
  DB_PASSWORD: '{{secret:DB}}'
  DB_PORT: "5432"
  DB_USERNAME: immich
  POSTGRES_DB: immich
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: immich
  REDIS_HOSTNAME: redis
  REDIS_PORT: "6379"
  UPLOAD_LOCATION: /data
services:
  - name: web
    image: ghcr.io/immich-app/immich-server:v1.135.3
    public: true
    port: 2283
    volumes:
      - path: /data
        sizeGi: 32
  - name: postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://immich.app
  logo: immich
  description: 'Une photothèque privée : albums, recherche et partage avec d''autres personnes. Les photos et leur classement sont conservés.'
  translations:
    de:
      summary: Eine Fotothek.
      description: 'Eine private Fotothek: Alben, Suche und Freigabe. Fotos und ihre Ordnung bleiben erhalten.'
    en:
      summary: A photo library.
      description: 'A private photo library: albums, search, and sharing. Photos and their order are kept.'
    it:
      summary: Una fototeca.
      description: 'Una fototeca privata: album, ricerca e condivisione. Le foto e il loro ordine sono conservati.'
    pt:
      summary: Uma fototeca.
      description: 'Uma fototeca privada: álbuns, pesquisa e partilha com outras pessoas. As fotos e a sua ordem são conservadas.'
