type: myinfra-package
version: 1
name: SilverBullet
summary: Des notes en markdown.
category: Notes et liens
services:
  - name: silverbullet
    image: zefhemel/silverbullet:0.10.4
    public: true
    port: 3000
    volumes:
      - path: /space
        sizeGi: 2
about:
  site: https://silverbullet.md
  logo: silverbullet
  description: Des notes en markdown, reliées et cherchées comme un petit site personnel. Les notes sont conservées.
  translations:
    de:
      summary: Notizen in Markdown.
      description: Notizen in Markdown, verknüpft und durchsucht wie eine kleine persönliche Seite. Die Notizen bleiben erhalten.
    en:
      summary: Notes in Markdown.
      description: Notes in Markdown, linked and searched like a small personal site. The notes are kept.
    it:
      summary: Note in markdown.
      description: Note in markdown, collegate e cercate come un piccolo sito personale. Le note sono conservate.
    pt:
      summary: Notas em markdown.
      description: Notas em markdown, ligadas e procuradas como um pequeno site pessoal. As notas são conservadas.
