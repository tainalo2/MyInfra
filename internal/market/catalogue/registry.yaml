type: myinfra-package
version: 1
name: Registre d'images
summary: Un dépôt d'images de conteneurs.
category: Code et données
env:
  REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
services:
  - name: registry
    image: registry:2
    public: true
    port: 5000
    volumes:
      - path: /var/lib/registry
        sizeGi: 16
about:
  site: https://github.com/distribution/distribution
  logo: docker
  description: Un dépôt où envoyer et reprendre des images d'applications. Les images déposées sont conservées.
  translations:
    de:
      summary: Ein Lager für Container-Images.
      description: Ein Lager, in das Anwendungs-Images geschickt und wieder geholt werden. Abgelegte Images bleiben erhalten.
    en:
      summary: A store of container images.
      description: A store where application images are sent and pulled. Deposited images are kept.
    it:
      summary: Un deposito di immagini di container.
      description: Un deposito dove inviare e riprendere immagini di applicazioni. Le immagini depositate sono conservate.
    pt:
      summary: Um depósito de imagens de contentores.
      description: Um depósito onde se enviam e se recuperam imagens de aplicações. As imagens depositadas são conservadas.
