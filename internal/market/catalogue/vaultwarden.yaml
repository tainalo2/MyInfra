type: myinfra-package
version: 1
name: Vaultwarden
summary: Un coffre de mots de passe.
category: Identité
env:
  ADMIN_TOKEN: '{{secret:ADMIN}}'
  DOMAIN: '{{url}}'
  SIGNUPS_ALLOWED: "true"
services:
  - name: vaultwarden
    image: vaultwarden/server:1.34.1
    public: true
    port: 80
    volumes:
      - path: /data
        sizeGi: 2
about:
  site: https://github.com/dani-garcia/vaultwarden
  logo: vaultwarden
  description: Un coffre de mots de passe, compatible avec les applications Bitwarden. Le coffre est conservé.
  translations:
    de:
      summary: Ein Passworttresor.
      description: Ein Passworttresor, kompatibel mit den Bitwarden-Anwendungen. Der Tresor bleibt erhalten.
    en:
      summary: A password vault.
      description: A password vault, compatible with Bitwarden applications. The vault is kept.
    it:
      summary: Una cassaforte di password.
      description: Una cassaforte di password, compatibile con le applicazioni Bitwarden. La cassaforte è conservata.
    pt:
      summary: Um cofre de palavras-passe.
      description: Um cofre de palavras-passe, compatível com as aplicações Bitwarden. O cofre é conservado.
