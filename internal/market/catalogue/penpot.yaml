type: myinfra-package
version: 1
name: Penpot
summary: Un atelier de maquettes.
category: Collaboration
env:
  PENPOT_DATABASE_URI: postgresql://penpot:{{secret:DB}}@postgres/penpot
  PENPOT_FLAGS: disable-email-verification enable-registration disable-secure-session-cookies
  PENPOT_PUBLIC_URI: '{{url}}'
  PENPOT_REDIS_URI: redis://redis:6379/0
  PENPOT_SECRET_KEY: '{{secret:SECRET}}'
  POSTGRES_DB: penpot
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: penpot
services:
  - name: frontend
    image: penpotapp/frontend:2.6.2
    public: true
    port: 8080
  - name: backend
    image: penpotapp/backend:2.6.2
    port: 6060
    volumes:
      - path: /opt/data
        sizeGi: 8
  - name: exporter
    image: penpotapp/exporter:2.6.2
    port: 6061
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://penpot.app
  logo: penpot
  description: Un atelier pour dessiner des maquettes d'écrans et des composants. Les fichiers de travail sont conservés.
  translations:
    de:
      summary: Eine Werkstatt für Entwürfe.
      description: Eine Werkstatt, um Bildschirmentwürfe und Komponenten zu zeichnen. Die Arbeitsdateien bleiben erhalten.
    en:
      summary: A workshop for mockups.
      description: A workshop for drawing screen mockups and components. The working files are kept.
    it:
      summary: Un laboratorio di bozze.
      description: Un laboratorio per disegnare bozze di schermate e componenti. I file di lavoro sono conservati.
    pt:
      summary: Uma oficina de maquetas.
      description: Uma oficina para desenhar maquetas de ecrãs e componentes. Os ficheiros de trabalho são conservados.
