type: myinfra-package
version: 1
name: Ghostfolio
summary: Un suivi de patrimoine.
category: Comptes personnels
env:
  ACCESS_TOKEN_SALT: '{{secret:SALT}}'
  DATABASE_URL: postgresql://ghostfolio:{{secret:DB}}@postgres:5432/ghostfolio?sslmode=disable
  JWT_SECRET_KEY: '{{secret:JWT}}'
  POSTGRES_DB: ghostfolio
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: ghostfolio
  REDIS_HOST: redis
  REDIS_PORT: "6379"
services:
  - name: web
    image: ghostfolio/ghostfolio:2.168.0
    public: true
    port: 3333
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://ghostfol.io
  logo: ghostfolio
  description: 'Un suivi de patrimoine : comptes, actifs et évolution. Les données sont dans la base.'
  translations:
    de:
      summary: Eine Vermögensübersicht.
      description: 'Eine Vermögensübersicht: Konten, Anlagen und Verlauf. Die Daten liegen in der Datenbank.'
    en:
      summary: A record of wealth.
      description: 'A record of wealth: accounts, assets, and change. The data is in the database.'
    it:
      summary: Un seguito del patrimonio.
      description: 'Un seguito del patrimonio: conti, attività ed evoluzione. I dati stanno nel database.'
    pt:
      summary: Um seguimento de património.
      description: 'Um seguimento de património: contas, ativos e evolução. Os dados estão na base.'
