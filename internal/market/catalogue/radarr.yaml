type: myinfra-package
version: 1
name: Radarr
summary: Le suivi des films.
category: Médias
services:
  - name: radarr
    image: linuxserver/radarr:5.28.0
    public: true
    port: 7878
    volumes:
      - path: /config
        sizeGi: 8
about:
  site: https://radarr.video
  logo: radarr
  description: 'Le suivi des films : indexeurs, qualités, téléchargements et bibliothèque. La configuration et l''historique sont conservés.'
  translations:
    de:
      summary: Filme.
      description: 'Filme: Indexer, Qualitäten, Downloads und Bibliothek. Konfiguration und Verlauf bleiben erhalten.'
    en:
      summary: Movies.
      description: 'Movies: indexers, qualities, downloads, and library. The configuration and history are kept.'
    it:
      summary: Film.
      description: 'Film: indexer, qualità, download e libreria. La configurazione e la cronologia sono conservate.'
    pt:
      summary: Filmes.
      description: 'Filmes: indexadores, qualidades, descarregamentos e biblioteca. A configuração e o histórico são conservados.'
