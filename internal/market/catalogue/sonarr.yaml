type: myinfra-package
version: 1
name: Sonarr
summary: Le suivi des séries télévisées.
category: Médias
services:
  - name: sonarr
    image: linuxserver/sonarr:4.0.20
    public: true
    port: 8989
    volumes:
      - path: /config
        sizeGi: 8
about:
  site: https://sonarr.tv
  logo: sonarr
  description: 'Le suivi des séries : indexeurs, qualités, téléchargements et bibliothèque. La configuration et l''historique sont conservés.'
  translations:
    de:
      summary: Fernsehserien.
      description: 'Fernsehserien: Indexer, Qualitäten, Downloads und Bibliothek. Konfiguration und Verlauf bleiben erhalten.'
    en:
      summary: TV series.
      description: 'TV series: indexers, qualities, downloads, and library. The configuration and history are kept.'
    it:
      summary: Serie TV.
      description: 'Serie TV: indexer, qualità, download e libreria. La configurazione e la cronologia sono conservate.'
    pt:
      summary: Séries de televisão.
      description: 'Séries de televisão: indexadores, qualidades, descarregamentos e biblioteca. A configuração e o histórico são conservados.'
