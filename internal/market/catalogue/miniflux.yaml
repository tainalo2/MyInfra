type: myinfra-package
version: 1
name: Miniflux
summary: Un lecteur de flux dépouillé.
category: Sites
env:
  ADMIN_PASSWORD: '{{secret:ADMIN}}'
  ADMIN_USERNAME: admin
  CREATE_ADMIN: "1"
  DATABASE_URL: postgres://miniflux:{{secret:DB}}@postgres/miniflux?sslmode=disable
  POSTGRES_DB: miniflux
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: miniflux
  RUN_MIGRATIONS: "1"
services:
  - name: web
    image: miniflux/miniflux:2.2.6
    public: true
    port: 8080
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://miniflux.app
  logo: miniflux
  description: Un lecteur de flux volontairement simple. Les abonnements et les articles lus sont dans la base.
  translations:
    de:
      summary: Ein schlichter Feed-Leser.
      description: Ein bewusst einfacher Feed-Leser. Abonnements und gelesene Artikel liegen in der Datenbank.
    en:
      summary: A plain feed reader.
      description: A deliberately simple feed reader. Subscriptions and read articles are in the database.
    it:
      summary: Un lettore di feed essenziale.
      description: Un lettore di feed volutamente semplice. Abbonamenti e articoli letti stanno nel database.
    pt:
      summary: Um leitor de feeds despido.
      description: Um leitor de feeds deliberadamente simples. As subscrições e os artigos lidos estão na base.
