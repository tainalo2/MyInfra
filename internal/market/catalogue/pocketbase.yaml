type: myinfra-package
version: 1
name: PocketBase
summary: Une petite base et son interface.
category: Code et données
services:
  - name: pocketbase
    image: ghcr.io/pocketbase/pocketbase:0.28.4
    public: true
    port: 8090
    args:
      - serve
      - --http=0.0.0.0:8090
    volumes:
      - path: /pb_data
        sizeGi: 4
about:
  site: https://pocketbase.io
  logo: pocketbase
  description: Une petite base, son interface d'administration et une API. Les données sont conservées.
  translations:
    de:
      summary: Eine kleine Datenbank und ihre Oberfläche.
      description: Eine kleine Datenbank, ihre Verwaltungsoberfläche und eine API. Die Daten bleiben erhalten.
    en:
      summary: A small database and its interface.
      description: A small database, its admin interface, and an API. The data is kept.
    it:
      summary: Un piccolo database e la sua interfaccia.
      description: Un piccolo database, la sua interfaccia di amministrazione e un'API. I dati sono conservati.
    pt:
      summary: Uma pequena base e a sua interface.
      description: Uma pequena base, a sua interface de administração e uma API. Os dados são conservados.
