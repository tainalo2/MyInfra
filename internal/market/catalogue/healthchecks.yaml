type: myinfra-package
version: 1
name: Healthchecks
summary: La confirmation que des tâches ont bien tourné.
category: Automatisation
env:
  DB: postgres
  DB_HOST: postgres
  DB_NAME: healthchecks
  DB_PASSWORD: '{{secret:DB}}'
  DB_PORT: "5432"
  DB_USER: healthchecks
  POSTGRES_DB: healthchecks
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: healthchecks
  SECRET_KEY: '{{secret:SECRET}}'
  SITE_ROOT: '{{url}}'
services:
  - name: web
    image: healthchecks/healthchecks:version-3.6
    public: true
    port: 8000
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://healthchecks.io
  logo: healthchecks
  description: La confirmation qu'une tâche prévue a bien tourné, et une alerte sinon. Les contrôles sont dans la base.
  translations:
    de:
      summary: Die Bestätigung, dass Aufgaben liefen.
      description: Die Bestätigung, dass eine geplante Aufgabe gelaufen ist, sonst ein Alarm. Die Prüfungen liegen in der Datenbank.
    en:
      summary: Confirmation that tasks did run.
      description: Confirmation that a scheduled task did run, and an alert otherwise. The checks are in the database.
    it:
      summary: La conferma che i compiti sono andati.
      description: La conferma che un compito previsto è andato, e un avviso altrimenti. I controlli stanno nel database.
    pt:
      summary: A confirmação de que as tarefas correram.
      description: A confirmação de que uma tarefa prevista correu, e um alerta caso contrário. Os controlos estão na base.
