type: myinfra-package
version: 1
name: Outline
summary: Une base de connaissances.
category: Collaboration
env:
  DATABASE_URL: postgres://outline:{{secret:DB}}@postgres:5432/outline
  FILE_STORAGE: local
  FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
  POSTGRES_DB: outline
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: outline
  REDIS_URL: redis://redis:6379
  SECRET_KEY: '{{secret:SECRET}}'
  URL: '{{url}}'
  UTILS_SECRET: '{{secret:UTILS}}'
services:
  - name: web
    image: outlinewiki/outline:0.82.0
    public: true
    port: 3000
    volumes:
      - path: /var/lib/outline/data
        sizeGi: 8
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://www.getoutline.com
  logo: outline
  description: 'Une base de connaissances : collections, pages et recherche. Les documents sont conservés.'
  translations:
    de:
      summary: Eine Wissensbasis.
      description: 'Eine Wissensbasis: Sammlungen, Seiten und Suche. Die Dokumente bleiben erhalten.'
    en:
      summary: A knowledge base.
      description: 'A knowledge base: collections, pages, and search. The documents are kept.'
    it:
      summary: Una base di conoscenza.
      description: 'Una base di conoscenza: raccolte, pagine e ricerca. I documenti sono conservati.'
    pt:
      summary: Uma base de conhecimentos.
      description: 'Uma base de conhecimentos: coleções, páginas e pesquisa. Os documentos são conservados.'
