type: myinfra-package
version: 1
name: Joplin Server
summary: La synchronisation des notes Joplin.
category: Notes et liens
env:
  APP_BASE_URL: '{{url}}'
  APP_PORT: "22300"
  DB_CLIENT: pg
  POSTGRES_DATABASE: joplin
  POSTGRES_DB: joplin
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_PORT: "5432"
  POSTGRES_USER: joplin
services:
  - name: web
    image: joplin/server:3.3.3
    public: true
    port: 22300
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://joplinapp.org
  logo: joplin
  description: Le serveur qui synchronise les notes Joplin entre les appareils. Les notes sont dans la base.
  translations:
    de:
      summary: Die Synchronisation der Joplin-Notizen.
      description: Der Server, der Joplin-Notizen zwischen Geräten synchronisiert. Die Notizen liegen in der Datenbank.
    en:
      summary: Sync for Joplin notes.
      description: The server that syncs Joplin notes across devices. The notes are in the database.
    it:
      summary: La sincronizzazione delle note Joplin.
      description: Il server che sincronizza le note Joplin tra i dispositivi. Le note stanno nel database.
    pt:
      summary: A sincronização das notas Joplin.
      description: O servidor que sincroniza as notas Joplin entre os aparelhos. As notas estão na base.
