type: myinfra-package
version: 1
name: Mattermost
summary: Une discussion d'équipe.
category: Collaboration
env:
  MM_SERVICESETTINGS_SITEURL: '{{url}}'
  MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:{{secret:DB}}@postgres:5432/mattermost?sslmode=disable
  MM_SQLSETTINGS_DRIVERNAME: postgres
  POSTGRES_DB: mattermost
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: mattermost
services:
  - name: web
    image: mattermost/mattermost-team-edition:10.5
    public: true
    port: 8065
    volumes:
      - path: /mattermost/data
        sizeGi: 8
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://mattermost.com
  logo: mattermost
  description: Des discussions d'équipe par salons, avec l'historique et les fichiers joints. Les messages sont dans la base.
  translations:
    de:
      summary: Ein Teamgespräch.
      description: Teamgespräche in Kanälen, mit Verlauf und Anhängen. Die Nachrichten liegen in der Datenbank.
    en:
      summary: A team conversation.
      description: Team conversations in channels, with history and attachments. Messages are in the database.
    it:
      summary: Una conversazione di squadra.
      description: Conversazioni di squadra per stanze, con cronologia e allegati. I messaggi stanno nel database.
    pt:
      summary: Uma conversa de equipa.
      description: Conversas de equipa por salas, com o histórico e os ficheiros anexos. As mensagens estão na base.
