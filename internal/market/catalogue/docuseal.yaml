type: myinfra-package
version: 1
name: DocuSeal
summary: Des documents à signer.
category: Échanges
env:
  DATABASE_URL: postgresql://docuseal:{{secret:DB}}@postgres:5432/docuseal
  POSTGRES_DB: docuseal
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: docuseal
  SECRET_KEY_BASE: '{{secret:SECRET}}'
services:
  - name: web
    image: docuseal/docuseal:1.9.4
    public: true
    port: 3000
    volumes:
      - path: /data
        sizeGi: 8
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://www.docuseal.com
  logo: docuseal
  description: Des documents à faire signer, avec le suivi des signatures. Les documents sont conservés.
  translations:
    de:
      summary: Dokumente zum Unterschreiben.
      description: Dokumente zum Unterschreiben, mit der Verfolgung der Unterschriften. Die Dokumente bleiben erhalten.
    en:
      summary: Documents to sign.
      description: Documents to have signed, with the tracking of signatures. The documents are kept.
    it:
      summary: Documenti da firmare.
      description: Documenti da far firmare, con il seguito delle firme. I documenti sono conservati.
    pt:
      summary: Documentos a assinar.
      description: Documentos a fazer assinar, com o seguimento das assinaturas. Os documentos são conservados.
