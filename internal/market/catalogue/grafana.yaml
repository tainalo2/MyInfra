type: myinfra-package
version: 1
name: Grafana
summary: Des tableaux de bord.
category: Fichiers et tableaux
env:
  GF_SECURITY_ADMIN_PASSWORD: '{{secret:ADMIN}}'
  GF_SECURITY_ADMIN_USER: admin
  GF_SERVER_ROOT_URL: '{{url}}'
services:
  - name: grafana
    image: grafana/grafana:11.6.1
    public: true
    port: 3000
    volumes:
      - path: /var/lib/grafana
        sizeGi: 4
about:
  site: https://grafana.com
  logo: grafana
  description: Des tableaux de bord pour suivre des mesures dans le temps. Les tableaux sont conservés.
  translations:
    de:
      summary: Übersichten.
      description: Übersichten, um Messwerte über die Zeit zu verfolgen. Die Übersichten bleiben erhalten.
    en:
      summary: Dashboards.
      description: Dashboards for following measurements over time. The dashboards are kept.
    it:
      summary: Cruscotti.
      description: Cruscotti per seguire le misure nel tempo. I cruscotti sono conservati.
    pt:
      summary: Painéis.
      description: Painéis para seguir medições ao longo do tempo. Os painéis são conservados.
