type: myinfra-package
version: 1
name: Nextcloud
summary: Fichiers, agenda et contacts partagés.
category: Collaboration
env:
  MARIADB_DATABASE: nextcloud
  MARIADB_PASSWORD: '{{secret:DB}}'
  MARIADB_ROOT_PASSWORD: '{{secret:ROOT}}'
  MARIADB_USER: nextcloud
  MYSQL_DATABASE: nextcloud
  MYSQL_HOST: mariadb
  MYSQL_PASSWORD: '{{secret:DB}}'
  MYSQL_USER: nextcloud
  NEXTCLOUD_ADMIN_PASSWORD: '{{secret:ADMIN}}'
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_TRUSTED_DOMAINS: '{{host}}'
  REDIS_HOST: redis
services:
  - name: web
    image: nextcloud:31-apache
    public: true
    port: 80
    volumes:
      - path: /var/www/html
        sizeGi: 32
  - name: mariadb
    image: mariadb:11
    port: 3306
    volumes:
      - path: /var/lib/mysql
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://nextcloud.com
  logo: nextcloud
  description: Fichiers, agenda, contacts et partage, pour une personne ou une équipe. Les fichiers et la base sont conservés.
  translations:
    de:
      summary: Geteilte Dateien, Kalender und Kontakte.
      description: Dateien, Kalender, Kontakte und Freigabe, für eine Person oder ein Team. Dateien und die Datenbank bleiben erhalten.
    en:
      summary: Shared files, calendar, and contacts.
      description: Files, calendar, contacts, and sharing, for one person or a team. Files and the database are kept.
    it:
      summary: File, agenda e contatti condivisi.
      description: File, agenda, contatti e condivisione, per una persona o un gruppo. File e database sono conservati.
    pt:
      summary: Ficheiros, agenda e contactos partilhados.
      description: Ficheiros, agenda, contactos e partilha, para uma pessoa ou uma equipa. Os ficheiros e a base são conservados.
