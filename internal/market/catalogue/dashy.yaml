type: myinfra-package
version: 1
name: Dashy
summary: Un tableau de liens.
category: Outils
services:
  - name: dashy
    image: lissy93/dashy:3.1.1
    public: true
    port: 8080
    volumes:
      - path: /app/user-data
        sizeGi: 1
about:
  site: https://dashy.to
  logo: dashy
  description: Un tableau de liens vers les services, organisé en sections. La disposition de la page est conservée.
  translations:
    de:
      summary: Eine Tafel aus Links.
      description: Eine Tafel aus Links zu den Diensten, in Abschnitten geordnet. Die Anordnung der Seite bleibt erhalten.
    en:
      summary: A board of links.
      description: A board of links to services, organised in sections. The page layout is kept.
    it:
      summary: Una bacheca di link.
      description: Una bacheca di link verso i servizi, organizzata in sezioni. La disposizione della pagina è conservata.
    pt:
      summary: Um quadro de ligações.
      description: Um quadro de ligações para os serviços, organizado em secções. A disposição da página é conservada.
