type: myinfra-package
version: 1
name: Meilisearch
summary: Un moteur de recherche.
category: Code et données
env:
  MEILI_ENV: production
  MEILI_MASTER_KEY: '{{secret:KEY}}'
  MEILI_NO_ANALYTICS: "true"
services:
  - name: meilisearch
    image: getmeili/meilisearch:v1.13.3
    public: true
    port: 7700
    volumes:
      - path: /meili_data
        sizeGi: 8
about:
  site: https://www.meilisearch.com
  logo: meilisearch
  description: Un moteur de recherche rapide, que d'autres applications peuvent interroger. L'index est conservé.
  translations:
    de:
      summary: Eine Suchmaschine.
      description: Eine schnelle Suchmaschine, die andere Anwendungen abfragen können. Der Index bleibt erhalten.
    en:
      summary: A search engine.
      description: A fast search engine that other applications can query. The index is kept.
    it:
      summary: Un motore di ricerca.
      description: Un motore di ricerca veloce, che altre applicazioni possono interrogare. L'indice è conservato.
    pt:
      summary: Um motor de pesquisa.
      description: Um motor de pesquisa rápido, que outras aplicações podem consultar. O índice é conservado.
