type: myinfra-package
version: 1
name: Appsmith
summary: Des écrans posés sur des données.
category: Fichiers et tableaux
services:
  - name: appsmith
    image: appsmith/appsmith-ce:v1.65
    public: true
    port: 80
    volumes:
      - path: /appsmith-stacks
        sizeGi: 8
about:
  site: https://www.appsmith.com
  logo: appsmith
  description: Des écrans que l'on compose au-dessus de données existantes. Les applications créées sont conservées.
  translations:
    de:
      summary: Bildschirme über Daten.
      description: Bildschirme, die man über vorhandene Daten legt. Die erstellten Anwendungen bleiben erhalten.
    en:
      summary: Screens laid over data.
      description: Screens composed over existing data. The applications you create are kept.
    it:
      summary: Schermate posate sui dati.
      description: Schermate composte sopra dati esistenti. Le applicazioni create sono conservate.
    pt:
      summary: Ecrãs pousados sobre dados.
      description: Ecrãs que se compõem por cima de dados existentes. As aplicações criadas são conservadas.
