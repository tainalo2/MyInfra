type: myinfra-package
version: 1
name: Wallabag
summary: Des pages mises de côté pour plus tard.
category: Sites
env:
  MARIADB_DATABASE: wallabag
  MARIADB_PASSWORD: '{{secret:DB}}'
  MARIADB_ROOT_PASSWORD: '{{secret:ROOT}}'
  MARIADB_USER: wallabag
  SYMFONY__ENV__DATABASE_DRIVER: pdo_mysql
  SYMFONY__ENV__DATABASE_HOST: mariadb
  SYMFONY__ENV__DATABASE_NAME: wallabag
  SYMFONY__ENV__DATABASE_PASSWORD: '{{secret:DB}}'
  SYMFONY__ENV__DATABASE_PORT: "3306"
  SYMFONY__ENV__DATABASE_USER: wallabag
  SYMFONY__ENV__DOMAIN_NAME: '{{url}}'
  SYMFONY__ENV__SECRET: '{{secret:SECRET}}'
services:
  - name: web
    image: wallabag/wallabag:2.6.13
    public: true
    port: 80
    volumes:
      - path: /var/www/wallabag/data
        sizeGi: 4
  - name: mariadb
    image: mariadb:11
    port: 3306
    volumes:
      - path: /var/lib/mysql
        sizeGi: 8
about:
  site: https://wallabag.org
  logo: wallabag
  description: Les pages que l'on met de côté pour les lire plus tard, sans leur mise en forme d'origine. Les articles sauvés sont conservés.
  translations:
    de:
      summary: Seiten für später.
      description: Seiten, die man für später zurücklegt, ohne das ursprüngliche Layout. Gespeicherte Artikel bleiben erhalten.
    en:
      summary: Pages set aside for later.
      description: Pages set aside to read later, without their original layout. Saved articles are kept.
    it:
      summary: Pagine messe da parte per dopo.
      description: Le pagine messe da parte per leggerle dopo, senza l'impaginazione originale. Gli articoli salvati sono conservati.
    pt:
      summary: Páginas postas de lado para mais tarde.
      description: As páginas que se põem de lado para ler mais tarde, sem a formatação de origem. Os artigos guardados são conservados.
