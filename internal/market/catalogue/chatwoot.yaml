type: myinfra-package
version: 1
name: Chatwoot
summary: Une boîte de conversation avec les visiteurs.
category: Échanges
inputs:
  - key: email
    label: Adresse de contact
env:
  FRONTEND_URL: '{{url}}'
  MAILER_SENDER_EMAIL: '{{input:email}}'
  NODE_ENV: production
  POSTGRES_DATABASE: chatwoot
  POSTGRES_DB: chatwoot
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_PORT: "5432"
  POSTGRES_USER: chatwoot
  POSTGRES_USERNAME: chatwoot
  RAILS_ENV: production
  REDIS_URL: redis://redis:6379
  SECRET_KEY_BASE: '{{secret:SECRET}}'
services:
  - name: web
    image: chatwoot/chatwoot:v4.4.0
    public: true
    port: 3000
    volumes:
      - path: /app/storage
        sizeGi: 8
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
  - name: redis
    image: redis:7-alpine
    port: 6379
about:
  site: https://www.chatwoot.com
  logo: chatwoot
  description: Une boîte de conversation pour répondre aux visiteurs d'un site. Les échanges sont dans la base.
  translations:
    de:
      summary: Ein Gesprächskasten mit den Besuchern.
      description: Ein Gesprächskasten, um den Besuchern einer Seite zu antworten. Die Wechsel liegen in der Datenbank.
    en:
      summary: A conversation box with visitors.
      description: A conversation box for answering a site's visitors. The exchanges are in the database.
    it:
      summary: Una casella di conversazione con i visitatori.
      description: Una casella di conversazione per rispondere ai visitatori di un sito. Gli scambi stanno nel database.
    pt:
      summary: Uma caixa de conversa com os visitantes.
      description: Uma caixa de conversa para responder aos visitantes de um site. As trocas estão na base.
