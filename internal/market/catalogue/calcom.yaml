type: myinfra-package
version: 1
name: Cal.com
summary: Des rendez-vous à réserver.
category: Collaboration
inputs:
  - key: email
    label: Adresse de contact
env:
  CALENDSO_ENCRYPTION_KEY: '{{secret:ENC}}'
  DATABASE_URL: postgresql://cal:{{secret:DB}}@postgres:5432/cal
  EMAIL_FROM: '{{input:email}}'
  NEXTAUTH_SECRET: '{{secret:SECRET}}'
  NEXT_PUBLIC_WEBAPP_URL: '{{url}}'
  POSTGRES_DB: cal
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: cal
services:
  - name: web
    image: calcom/cal.com:v5.1.4
    public: true
    port: 3000
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://cal.com
  logo: caldotcom
  description: Une page où les autres réservent un rendez-vous selon vos disponibilités. Les réservations sont dans la base.
  translations:
    de:
      summary: Termine zum Buchen.
      description: Eine Seite, auf der andere einen Termin nach Ihrer Verfügbarkeit buchen. Die Buchungen liegen in der Datenbank.
    en:
      summary: Appointments to book.
      description: A page where others book a meeting according to your availability. Bookings are in the database.
    it:
      summary: Appuntamenti da prenotare.
      description: Una pagina dove gli altri prenotano un appuntamento secondo le tue disponibilità. Le prenotazioni stanno nel database.
    pt:
      summary: Encontros a reservar.
      description: Uma página onde os outros reservam um encontro segundo as suas disponibilidades. As reservas estão na base.
