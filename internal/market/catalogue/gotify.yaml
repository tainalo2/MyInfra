type: myinfra-package
version: 1
name: Gotify
summary: Des notifications vers le téléphone.
category: Outils
services:
  - name: gotify
    image: gotify/server:2.6.3
    public: true
    port: 80
    volumes:
      - path: /app/data
        sizeGi: 1
about:
  site: https://gotify.net
  logo: gotify
  description: Des notifications envoyées vers le téléphone ou le navigateur. Les messages sont conservés.
  translations:
    de:
      summary: Benachrichtigungen ans Telefon.
      description: Benachrichtigungen an das Telefon oder den Browser. Die Nachrichten bleiben erhalten.
    en:
      summary: Notifications to the phone.
      description: Notifications sent to the phone or the browser. The messages are kept.
    it:
      summary: Notifiche verso il telefono.
      description: Notifiche inviate al telefono o al browser. I messaggi sono conservati.
    pt:
      summary: Notificações para o telefone.
      description: Notificações enviadas para o telefone ou o navegador. As mensagens são conservadas.
