type: myinfra-package
version: 1
name: Wallos
summary: Le suivi des abonnements.
category: Comptes personnels
services:
  - name: wallos
    image: ghcr.io/ellite/wallos:2.45.0
    public: true
    port: 80
    volumes:
      - path: /var/www/html/db
        sizeGi: 1
about:
  site: https://github.com/ellite/Wallos
  logo: wallos
  description: 'Le suivi des abonnements : prix, échéance et prochain renouvellement. La liste est conservée.'
  translations:
    de:
      summary: Die Verfolgung der Abos.
      description: 'Die Verfolgung der Abos: Preis, Frist und nächste Verlängerung. Die Liste bleibt erhalten.'
    en:
      summary: Tracking subscriptions.
      description: 'Tracking subscriptions: price, due date, and next renewal. The list is kept.'
    it:
      summary: Il seguito degli abbonamenti.
      description: 'Il seguito degli abbonamenti: prezzo, scadenza e prossimo rinnovo. L''elenco è conservato.'
    pt:
      summary: O seguimento das subscrições.
      description: 'O seguimento das subscrições: preço, prazo e próxima renovação. A lista é conservada.'
