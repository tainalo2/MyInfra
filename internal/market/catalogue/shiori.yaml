type: myinfra-package
version: 1
name: Shiori
summary: Des pages mises de côté.
category: Notes et liens
env:
  SHIORI_DIR: /shiori
services:
  - name: shiori
    image: ghcr.io/go-shiori/shiori:v1.7.4
    public: true
    port: 8080
    volumes:
      - path: /shiori
        sizeGi: 2
about:
  site: https://github.com/go-shiori/shiori
  logo: shiori
  description: Des pages mises de côté pour être relues plus tard. Les articles sauvés sont conservés.
  translations:
    de:
      summary: Zurückgelegte Seiten.
      description: Seiten, die man zurücklegt, um sie später wieder zu lesen. Gespeicherte Artikel bleiben erhalten.
    en:
      summary: Pages set aside.
      description: Pages set aside to be read again later. Saved articles are kept.
    it:
      summary: Pagine messe da parte.
      description: Pagine messe da parte per essere rilette più tardi. Gli articoli salvati sono conservati.
    pt:
      summary: Páginas postas de lado.
      description: Páginas postas de lado para serem relidas mais tarde. Os artigos guardados são conservados.
