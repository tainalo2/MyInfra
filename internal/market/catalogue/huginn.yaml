type: myinfra-package
version: 1
name: Huginn
summary: Des agents qui surveillent et agissent.
category: Automatisation
env:
  APP_SECRET_TOKEN: '{{secret:SECRET}}'
  DATABASE_ADAPTER: mysql2
  DATABASE_HOST: mysql
  DATABASE_NAME: huginn
  DATABASE_PASSWORD: '{{secret:DB}}'
  DATABASE_PORT: "3306"
  DATABASE_USERNAME: huginn
  MYSQL_DATABASE: huginn
  MYSQL_PASSWORD: '{{secret:DB}}'
  MYSQL_ROOT_PASSWORD: '{{secret:ROOT}}'
  MYSQL_USER: huginn
services:
  - name: web
    image: huginn/huginn:latest
    public: true
    port: 3000
  - name: mysql
    image: mysql:8.4
    port: 3306
    volumes:
      - path: /var/lib/mysql
        sizeGi: 8
about:
  site: https://github.com/huginn/huginn
  logo: huginn
  description: Des agents qui surveillent des sources et déclenchent des actions. Les agents sont dans la base.
  translations:
    de:
      summary: Agenten, die beobachten und handeln.
      description: Agenten, die Quellen beobachten und Aktionen auslösen. Die Agenten liegen in der Datenbank.
    en:
      summary: Agents that watch and act.
      description: Agents that watch sources and trigger actions. The agents are in the database.
    it:
      summary: Agenti che sorvegliano e agiscono.
      description: Agenti che sorvegliano fonti e avviano azioni. Gli agenti stanno nel database.
    pt:
      summary: Agentes que vigiam e agem.
      description: Agentes que vigiam fontes e disparam ações. Os agentes estão na base.
