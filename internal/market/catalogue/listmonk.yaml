type: myinfra-package
version: 1
name: Listmonk
summary: Des listes de diffusion.
category: Automatisation
inputs:
  - key: email
    label: Adresse de contact
env:
  LISTMONK_ADMIN_PASSWORD: '{{secret:ADMIN}}'
  LISTMONK_ADMIN_USER: '{{input:email}}'
  LISTMONK_app__address: '{{url}}'
  LISTMONK_db__database: listmonk
  LISTMONK_db__host: postgres
  LISTMONK_db__password: '{{secret:DB}}'
  LISTMONK_db__port: "5432"
  LISTMONK_db__ssl_mode: disable
  LISTMONK_db__user: listmonk
  POSTGRES_DB: listmonk
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: listmonk
services:
  - name: web
    image: listmonk/listmonk:v5.0.2
    public: true
    port: 9000
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://listmonk.app
  logo: listmonk
  description: Des listes de diffusion et des campagnes d'e-mails. Les abonnés et les campagnes sont dans la base.
  translations:
    de:
      summary: Verteilerlisten.
      description: Verteilerlisten und E-Mail-Kampagnen. Abonnenten und Kampagnen liegen in der Datenbank.
    en:
      summary: Mailing lists.
      description: Mailing lists and email campaigns. Subscribers and campaigns are in the database.
    it:
      summary: Liste di diffusione.
      description: Liste di diffusione e campagne email. Iscritti e campagne stanno nel database.
    pt:
      summary: Listas de difusão.
      description: Listas de difusão e campanhas de e-mail. Os subscritores e as campanhas estão na base.
