type: myinfra-package
version: 1
name: Ghost
summary: Une publication en ligne.
category: Sites
env:
  MYSQL_DATABASE: ghost
  MYSQL_PASSWORD: '{{secret:DB}}'
  MYSQL_ROOT_PASSWORD: '{{secret:ROOT}}'
  MYSQL_USER: ghost
  database__client: mysql
  database__connection__database: ghost
  database__connection__host: mysql
  database__connection__password: '{{secret:DB}}'
  database__connection__user: ghost
  url: '{{url}}'
services:
  - name: web
    image: ghost:5-alpine
    public: true
    port: 2368
    volumes:
      - path: /var/lib/ghost/content
        sizeGi: 8
  - name: mysql
    image: mysql:8.4
    port: 3306
    volumes:
      - path: /var/lib/mysql
        sizeGi: 8
about:
  site: https://ghost.org
  logo: ghost
  description: Une publication en ligne, pensée pour les articles et les abonnés. Les textes et la base sont conservés.
  translations:
    de:
      summary: Eine Online-Publikation.
      description: Eine Online-Publikation für Beiträge und Abonnenten. Texte und die Datenbank bleiben erhalten.
    en:
      summary: An online publication.
      description: An online publication, built for posts and subscribers. Texts and the database are kept.
    it:
      summary: Una pubblicazione in linea.
      description: Una pubblicazione in linea, pensata per articoli e abbonati. Testi e database sono conservati.
    pt:
      summary: Uma publicação em linha.
      description: Uma publicação em linha, pensada para artigos e subscritores. Os textos e a base são conservados.
