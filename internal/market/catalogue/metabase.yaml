type: myinfra-package
version: 1
name: Metabase
summary: Des questions sur une base de données.
category: Fichiers et tableaux
env:
  MB_DB_DBNAME: metabase
  MB_DB_HOST: postgres
  MB_DB_PASS: '{{secret:DB}}'
  MB_DB_PORT: "5432"
  MB_DB_TYPE: postgres
  MB_DB_USER: metabase
  POSTGRES_DB: metabase
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: metabase
services:
  - name: web
    image: metabase/metabase:v0.54.9
    public: true
    port: 3000
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://www.metabase.com
  logo: metabase
  description: Des questions et des graphiques posés sur une base de données. Les questions enregistrées sont dans la base.
  translations:
    de:
      summary: Fragen an eine Datenbank.
      description: Fragen und Diagramme an eine Datenbank. Gespeicherte Fragen liegen in der Datenbank.
    en:
      summary: Questions about a database.
      description: Questions and charts asked of a database. Saved questions are in the database.
    it:
      summary: Domande su un database.
      description: Domande e grafici posti su un database. Le domande salvate stanno nel database.
    pt:
      summary: Perguntas sobre uma base de dados.
      description: Perguntas e gráficos feitos sobre uma base de dados. As perguntas guardadas estão na base.
