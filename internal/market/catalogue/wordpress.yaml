type: myinfra-package
version: 1
name: WordPress
summary: Un site et son espace d'écriture.
category: Sites
env:
  MARIADB_DATABASE: wordpress
  MARIADB_PASSWORD: '{{secret:DB}}'
  MARIADB_ROOT_PASSWORD: '{{secret:ROOT}}'
  MARIADB_USER: wordpress
  WORDPRESS_DB_HOST: mariadb
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_PASSWORD: '{{secret:DB}}'
  WORDPRESS_DB_USER: wordpress
services:
  - name: web
    image: wordpress:6-apache
    public: true
    port: 80
    volumes:
      - path: /var/www/html
        sizeGi: 8
  - name: mariadb
    image: mariadb:11
    port: 3306
    volumes:
      - path: /var/lib/mysql
        sizeGi: 8
about:
  site: https://wordpress.org
  logo: wordpress
  description: Un site de pages et d'articles, avec son espace d'écriture. Les textes, les médias et la base sont conservés.
  translations:
    de:
      summary: Eine Website und ihr Schreibraum.
      description: Eine Website aus Seiten und Beiträgen, mit ihrem Schreibraum. Texte, Medien und die Datenbank bleiben erhalten.
    en:
      summary: A site and its writing space.
      description: A site of pages and posts, with its writing space. Texts, media, and the database are kept.
    it:
      summary: Un sito e il suo spazio di scrittura.
      description: Un sito di pagine e articoli, con il suo spazio di scrittura. Testi, media e database sono conservati.
    pt:
      summary: Um site e o seu espaço de escrita.
      description: Um site de páginas e artigos, com o seu espaço de escrita. Os textos, os média e a base são conservados.
