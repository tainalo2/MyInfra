type: myinfra-package
version: 1
name: Etherpad
summary: Un texte écrit à plusieurs.
category: Collaboration
env:
  ADMIN_PASSWORD: '{{secret:ADMIN}}'
  TRUST_PROXY: "true"
services:
  - name: etherpad
    image: etherpad/etherpad:2.2.7
    public: true
    port: 9001
    volumes:
      - path: /opt/etherpad-lite/var
        sizeGi: 2
about:
  site: https://etherpad.org
  logo: etherpad
  description: Un texte écrit à plusieurs en même temps, avec l'historique des modifications. Les pads sont conservés.
  translations:
    de:
      summary: Ein Text, den mehrere schreiben.
      description: Ein Text, den mehrere gleichzeitig schreiben, mit der Änderungshistorie. Die Pads bleiben erhalten.
    en:
      summary: A text written by several people.
      description: A text written by several people at once, with the history of changes. The pads are kept.
    it:
      summary: Un testo scritto in più persone.
      description: Un testo scritto in più persone nello stesso momento, con la cronologia delle modifiche. I pad sono conservati.
    pt:
      summary: Um texto escrito a várias pessoas.
      description: Um texto escrito a várias pessoas ao mesmo tempo, com o histórico das alterações. Os pads são conservados.
