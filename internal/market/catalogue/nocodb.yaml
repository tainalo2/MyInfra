type: myinfra-package
version: 1
name: NocoDB
summary: Une base sous forme de tableau.
category: Collaboration
env:
  NC_DB: pg://postgres:5432?u=nocodb&p={{secret:DB}}&d=nocodb
  POSTGRES_DB: nocodb
  POSTGRES_PASSWORD: '{{secret:DB}}'
  POSTGRES_USER: nocodb
services:
  - name: web
    image: nocodb/nocodb:0.263.8
    public: true
    port: 8080
    volumes:
      - path: /usr/app/data
        sizeGi: 4
  - name: postgres
    image: postgres:16
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        sizeGi: 8
about:
  site: https://nocodb.com
  logo: nocodb
  description: Une base de données présentée comme un tableau, que l'on peut relier et partager. Les données sont dans la base.
  translations:
    de:
      summary: Eine Datenbank als Tabelle.
      description: Eine Datenbank als Tabelle, die man verknüpfen und teilen kann. Die Daten liegen in der Datenbank.
    en:
      summary: A database as a table.
      description: A database shown as a table, which can be linked and shared. The data is in the database.
    it:
      summary: Un database in forma di tabella.
      description: Un database presentato come una tabella, da collegare e condividere. I dati stanno nel database.
    pt:
      summary: Uma base em forma de tabela.
      description: Uma base de dados apresentada como uma tabela, que se pode ligar e partilhar. Os dados estão na base.
