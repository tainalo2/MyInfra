type: myinfra-package
version: 1
name: Shlink
summary: Des liens courts.
category: Sites
env:
  DB_DRIVER: maria
  DB_HOST: mariadb
  DB_NAME: shlink
  DB_PASSWORD: '{{secret:DB}}'
  DB_PORT: "3306"
  DB_USER: shlink
  DEFAULT_DOMAIN: '{{host}}'
  INITIAL_API_KEY: '{{secret:KEY}}'
  IS_HTTPS_ENABLED: "true"
  MARIADB_DATABASE: shlink
  MARIADB_PASSWORD: '{{secret:DB}}'
  MARIADB_ROOT_PASSWORD: '{{secret:ROOT}}'
  MARIADB_USER: shlink
services:
  - name: web
    image: shlinkio/shlink:4.4.6
    public: true
    port: 8080
  - name: mariadb
    image: mariadb:11
    port: 3306
    volumes:
      - path: /var/lib/mysql
        sizeGi: 8
about:
  site: https://shlink.io
  logo: shlink
  description: Des adresses courtes qui renvoient vers les liens d'origine, avec un suivi des visites. Les liens sont dans la base.
  translations:
    de:
      summary: Kurze Links.
      description: Kurze Adressen, die auf die ursprünglichen Links zeigen, mit Besuchszählung. Die Links liegen in der Datenbank.
    en:
      summary: Short links.
      description: Short addresses that point to the original links, with a visit count. The links are in the database.
    it:
      summary: Link brevi.
      description: Indirizzi brevi che rimandano ai link originali, con il conteggio delle visite. I link stanno nel database.
    pt:
      summary: Ligações curtas.
      description: Endereços curtos que apontam para as ligações de origem, com o seguimento das visitas. As ligações estão na base.
