type: myinfra-package
version: 1
name: Excalidraw
summary: Un tableau blanc.
category: Collaboration
services:
  - name: excalidraw
    image: excalidraw/excalidraw:v0.18.0
    public: true
    port: 80
about:
  site: https://excalidraw.com
  logo: excalidraw
