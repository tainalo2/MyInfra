name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: myinfra
          POSTGRES_PASSWORD: myinfra
          POSTGRES_DB: myinfra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myinfra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://myinfra:myinfra@127.0.0.1:5432/myinfra?sslmode=disable
      MYINFRA_NO_BROWSER: "1"
      MYINFRA_ADDR: ":8080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Interface
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Interface embarquée
        run: |
          rm -rf internal/ui/dist
          cp -a web/dist internal/ui/dist
      - name: Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -o myinfra ./cmd/myinfra
          # Each system has its own app and window: every one must build.
          for target in darwin/arm64 windows/amd64 windows/arm64 linux/arm64 freebsd/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./cmd/...
          done
      - name: Démarrage
        run: |
          export MYINFRA_MASTER_KEY=$(head -c 32 /dev/urandom | base64)
          ./myinfra > myinfra.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health
      - name: Navigateur
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          E2E_URL=http://127.0.0.1:8080 npm run e2e
          E2E_URL=http://127.0.0.1:8080 npm run screenshots:check
      - if: failure()
        run: cat myinfra.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: web/test-results
