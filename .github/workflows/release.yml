name: Publication

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          ver=${GITHUB_REF_NAME#v}
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:${ver}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ref.outputs.version }}
            IMAGE=${{ steps.ref.outputs.image }}

  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          ver=${GITHUB_REF_NAME#v}
          echo "image=ghcr.io/${repo}:${ver}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: rm -rf internal/ui/dist && cp -a web/dist internal/ui/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "-s -w -X main.version=${{ steps.ref.outputs.version }} -X main.image=${{ steps.ref.outputs.image }}" \
            -o "myinfra_${{ steps.ref.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/myinfra
      - uses: actions/upload-artifact@v4
        with:
          name: myinfra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: myinfra_*

  release:
    needs: [image, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          ver=${GITHUB_REF_NAME#v}
          echo "image=ghcr.io/${repo}:${ver}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp deploy/compose.yaml dist/compose.yaml
      - run: cd dist && sha256sum myinfra_* compose.yaml > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          ## Image

          \`${{ steps.ref.outputs.image }}\`

          Architectures : \`linux/amd64\` et \`linux/arm64\`.

          ## Binaires

          \`linux\`, \`darwin\` et \`windows\`, \`amd64\` et \`arm64\`.

          Le fichier \`compose.yaml\` démarre PostgreSQL et MyInfra avec l'image de cette version.
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
