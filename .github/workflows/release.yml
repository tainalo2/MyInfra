name: Publication

# Publie une version : les exécutables de ./build (PostgreSQL embarqué), l'image
# Docker multi-architecture sur ghcr.io, puis une release GitHub qui les porte.
#
#   - pousser un tag : git tag v1.4.0 && git push origin v1.4.0
#   - ou lancer « Publication » depuis l'onglet Actions avec la version voulue :
#     le tag est créé sur le commit choisi.
#
# Une version avec un suffixe (1.4.0-rc.1) est publiée en préversion et ne
# déplace pas l'étiquette latest de l'image.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple 1.4.0 ou 1.4.0-rc.1"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publication-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      version: ${{ steps.ref.outputs.version }}
      image: ${{ steps.ref.outputs.image }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ver="${INPUT#v}"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version invalide : « $ver ». Attendu : 1.2.3 ou 1.2.3-rc.1."
            exit 1
          fi
          tag="v$ver"
          # Un tag déjà posé sur un autre commit n'est pas déplacé.
          existing=$(git ls-remote --tags origin "refs/tags/$tag^{}" "refs/tags/$tag" | awk 'END { print $1 }')
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Le tag $tag existe déjà sur le commit $existing. Choisissez une autre version."
            exit 1
          fi
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          prerelease=false
          case "$ver" in *-*) prerelease=true ;; esac
          {
            echo "tag=$tag"
            echo "version=$ver"
            echo "image=ghcr.io/$repo:$ver"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Publication de $tag (préversion : $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  # Rien n'est publié si le code ne passe pas les vérifications.
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: myinfra
          POSTGRES_PASSWORD: myinfra
          POSTGRES_DB: myinfra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myinfra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://myinfra:myinfra@127.0.0.1:5432/myinfra?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Interface
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Go
        run: |
          rm -rf internal/ui/dist
          cp -a web/dist internal/ui/dist
          go vet ./...
          go test ./...

  binaries:
    needs: [version, check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          # Pas de PostgreSQL embarqué pour Windows arm64 : il en faut un à part.
          - { goos: windows, goarch: arm64, ext: .exe, external: true }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Le même script que sur un poste : ce qui est publié est ce qui se construit en local.
      - name: Exécutable
        run: ./build ${{ matrix.goos }} ${{ matrix.goarch }}
      - name: Contrôle
        run: |
          src="dist/myinfra_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          out="dist/myinfra_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          mv "$src" "$out"
          # -trimpath ôte les -ldflags des informations de build : la version se
          # vérifie par l'image gravée avec elle, et en lançant l'exécutable Linux.
          grep -aqF "$IMAGE" "$out" || { echo "::error::Version absente de $out"; exit 1; }
          if [ "${{ matrix.external }}" != "true" ]; then
            go version -m "$out" | grep -q -- "-tags=postgresembed" || { echo "::error::PostgreSQL n'est pas embarqué dans $out"; exit 1; }
            # L'archive embarquée doit contenir PostgreSQL, pas seulement exister.
            tar -tzf internal/boot/postgres.tar.gz | grep -Eq '(^|/)bin/postgres(\.exe)?$' || { echo "::error::Archive PostgreSQL vide pour $out"; exit 1; }
          fi
          ls -lh "$out"
      - name: Démarrage
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          out="dist/myinfra_${VERSION}_linux_amd64"
          test "$("./$out" --version)" = "$VERSION"
          # Sans DATABASE_URL, l'exécutable démarre son propre PostgreSQL.
          home=$(mktemp -d)
          HOME="$home" MYINFRA_NO_BROWSER=1 MYINFRA_ADDR=127.0.0.1:8080 "./$out" > boot.log 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then
              echo "Démarré en ${i}s avec PostgreSQL embarqué."
              kill "$pid"
              exit 0
            fi
            sleep 1
          done
          cat boot.log
          echo "::error::L'exécutable ne démarre pas avec son PostgreSQL."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: myinfra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/myinfra_${{ needs.version.outputs.version }}_*
          if-no-files-found: error

  # L'exécutable Windows démarre sur Windows : pg_ctl s'y comporte autrement
  # que sous Linux, un exécutable pouvait attendre PostgreSQL sans fin.
  windows:
    needs: [version, binaries]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: myinfra-windows-amd64
          path: dist
      - name: Démarrage
        timeout-minutes: 5
        run: |
          out="dist/myinfra_${VERSION}_windows_amd64.exe"
          test "$("./$out" --version | tr -d '\r')" = "$VERSION"
          home="$RUNNER_TEMP/myinfra"
          MYINFRA_HOME="$home" MYINFRA_NO_BROWSER=1 MYINFRA_ADDR=127.0.0.1:8080 "./$out" > boot.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then
              echo "Démarré en ${i}s avec PostgreSQL embarqué."
              taskkill //F //IM "$(basename "$out")" > /dev/null
              "$home/pg/bin/pg_ctl.exe" -D "$home/pgdata" -m fast -w stop
              exit 0
            fi
            sleep 1
          done
          cat boot.log
          cat "$home/pg.log" 2>/dev/null || true
          echo "::error::L'exécutable Windows ne démarre pas avec son PostgreSQL."
          exit 1

  # MyInfra.app : un double-clic dans le Finder démarre MyInfra en arrière-plan.
  # Elle s'assemble et se signe sur un Mac, puis s'ouvre comme depuis le Finder.
  macos:
    needs: [version, binaries]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: myinfra-darwin-*
          path: dist
          merge-multiple: true
      - name: Application
        run: |
          out="dist/MyInfra_${VERSION}_macos.dmg"
          deploy/macos/package.sh "$VERSION" "$out" "dist/myinfra_${VERSION}_darwin_arm64" "dist/myinfra_${VERSION}_darwin_amd64"
          # The app is tested as it is installed: dragged out of the image.
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$out"
          test -L "$RUNNER_TEMP/dmg/Applications"
          mkdir app && ditto "$RUNNER_TEMP/dmg/MyInfra.app" app/MyInfra.app
          hdiutil detach "$RUNNER_TEMP/dmg"
          lipo -archs app/MyInfra.app/Contents/MacOS/myinfra | grep -q arm64
          lipo -archs app/MyInfra.app/Contents/MacOS/myinfra | grep -q x86_64
          test "$(app/MyInfra.app/Contents/MacOS/myinfra --version)" = "$VERSION"
          ls -lh "$out"
      - name: Démarrage
        timeout-minutes: 5
        run: |
          home="$RUNNER_TEMP/myinfra"
          # Sans quoi l'app propose d'abord de passer dans Applications.
          mkdir -p "$home" && touch "$home/no-move"
          launch() {
            open --env MYINFRA_HOME="$home" --env MYINFRA_NO_BROWSER=1 --env MYINFRA_ADDR=127.0.0.1:8080 app/MyInfra.app
          }
          fail() {
            cat "$home/myinfra.log" "$home/pg.log" 2>/dev/null || true
            echo "::error::$1"
            exit 1
          }
          launch
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health > /dev/null || fail "MyInfra.app ne démarre pas."
          echo "Démarré en ${i}s, en arrière-plan."
          # Un second double-clic rouvre le navigateur sans seconde copie.
          launch
          sleep 5
          test "$(pgrep -f 'MyInfra.app/Contents/MacOS/myinfra' | wc -l | tr -d ' ')" = 1 || fail "Un second lancement a démarré une autre copie."
          curl -sf http://127.0.0.1:8080/api/health > /dev/null || fail "Un second lancement a arrêté MyInfra."
          # Quitter, comme depuis le Dock, emporte PostgreSQL.
          osascript -e 'tell application id "io.github.tainalo2.myinfra" to quit'
          for i in $(seq 1 30); do
            [ -f "$home/pgdata/postmaster.pid" ] || break
            sleep 1
          done
          [ ! -f "$home/pgdata/postmaster.pid" ] || fail "PostgreSQL tourne encore après l'arrêt."
      - uses: actions/upload-artifact@v4
        with:
          name: myinfra-macos-app
          path: dist/MyInfra_${{ needs.version.outputs.version }}_macos.dmg
          if-no-files-found: error

  image:
    needs: [version, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            IMAGE=${{ needs.version.outputs.image }}
      - name: Contrôle
        run: |
          docker pull "${{ needs.version.outputs.image }}"
          test "$(docker run --rm "${{ needs.version.outputs.image }}" --version)" = "${{ needs.version.outputs.version }}"

  release:
    needs: [version, binaries, windows, macos, image]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # Seulement les exécutables : l'action Docker dépose aussi son propre artefact.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: myinfra-*
          merge-multiple: true
      - name: Fichiers
        run: |
          # Le compose publié démarre l'image de cette version, sauf si MYINFRA_IMAGE en désigne une autre.
          sed "s|image: \${MYINFRA_IMAGE}|image: \${MYINFRA_IMAGE:-$IMAGE}|" deploy/compose.yaml > dist/compose.yaml
          grep -q "$IMAGE" dist/compose.yaml
          # Une mise à jour en place refuse un autre PostgreSQL majeur que celui de ses données.
          pg=$(sed -n 's/^PG_VERSION=\([0-9]*\)\..*/\1/p' build)
          test -n "$pg"
          printf '{"version":"%s","postgres":"%s"}\n' "$VERSION" "$pg" > dist/release.json
          cd dist && sha256sum myinfra_* MyInfra_* compose.yaml release.json > SHA256SUMS && cat SHA256SUMS
      - name: Notes
        run: |
          cat > notes.md <<EOF
          ## Exécutables

          Un seul fichier, interface et PostgreSQL compris : téléchargez celui de votre système et lancez-le.

          | Système | Fichier |
          | --- | --- |
          | Linux x86-64 | \`myinfra_${VERSION}_linux_amd64\` |
          | Linux ARM64 | \`myinfra_${VERSION}_linux_arm64\` |
          | macOS, Intel et Apple Silicon | \`MyInfra_${VERSION}_macos.dmg\` : l'app MyInfra |
          | Windows x86-64 | \`myinfra_${VERSION}_windows_amd64.exe\` |
          | Windows ARM64 | \`myinfra_${VERSION}_windows_arm64.exe\` (sans PostgreSQL embarqué : indiquez \`DATABASE_URL\`) |

          Sur Linux : \`chmod +x\` sur le fichier.
          Sur macOS : ouvrez le .dmg et glissez MyInfra dans Applications, puis ouvrez-le : il s'ouvre dans le navigateur. Son icône reste dans le Dock tant qu'il tourne : un clic le rouvre, Quitter l'arrête. L'app n'est pas signée par Apple : au premier lancement, Réglages Système → Confidentialité et sécurité → « Ouvrir quand même ». Les exécutables \`myinfra_${VERSION}_darwin_*\` restent publiés pour le terminal et les mises à jour.
          Sur Windows, l'exécutable n'est pas signé non plus : si SmartScreen l'arrête, « Informations complémentaires » puis « Exécuter quand même ». Le premier démarrage prépare PostgreSQL et prend quelques secondes.
          \`SHA256SUMS\` permet de vérifier les téléchargements : \`sha256sum -c SHA256SUMS --ignore-missing\`.

          ## Image Docker

          \`${IMAGE}\` pour \`linux/amd64\` et \`linux/arm64\`.

          Le fichier \`compose.yaml\` démarre PostgreSQL et MyInfra avec cette image : il attend \`POSTGRES_PASSWORD\` et \`MYINFRA_MASTER_KEY\`.
          EOF
      - name: Release
        run: |
          flags=""
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            flags="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Une relance remplace les fichiers de la release déjà créée, sans toucher à ses notes.
            gh release upload "$TAG" dist/* --clobber
          else
            # Lancée à la main, la release pose le tag sur le commit choisi.
            # shellcheck disable=SC2086
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              --generate-notes \
              $flags
          fi
          echo "Release : https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
