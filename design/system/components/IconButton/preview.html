<!doctype html>
<html lang="fr">
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--color-canvas); color: var(--color-ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; }
  #root { padding: 20px 24px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .note { color: var(--color-faint); font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const M = window.MyInfra;
const I = M.icons;
M.setLang("fr");
function Demo() {
  return h("div", { className: "row", style: { gap: 24, paddingLeft: 8 } },
    h(M.IconButton, { icon: I.Copy, label: "Copier" }),
    h(M.IconButton, { icon: I.Eye, label: "Révéler" }),
    h(M.IconButton, { icon: I.RotateCw, label: "Redémarrer" }),
    h(M.IconButton, { icon: I.Trash2, label: "Supprimer" }));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
