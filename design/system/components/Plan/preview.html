<!-- @dsCard group="Motifs" height=260 subtitle="Bandes, cases et liens" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}
.box{position:relative;height:220px;width:640px}
.band{position:absolute;border-radius:6px;background:#fbfaf9}
.lab{position:absolute;font-size:11px;color:var(--color-faint)}
.n{position:absolute;box-sizing:border-box;height:44px;width:150px;padding:4px 10px;border:1px solid #d6d3d1;border-radius:6px;background:var(--color-surface);font-size:14px;line-height:1.2}
.n small{display:block;font-size:11px;color:var(--color-muted)}
.on{border:2px solid var(--color-ink)}
.w{border-color:var(--color-warn)}
svg{position:absolute;inset:0}
@keyframes f{to{stroke-dashoffset:-14}} .flow{animation:f 1.1s linear infinite}
</style></head><body><div class="box">
<div class="band" style="left:0;top:0;width:170px;height:150px"></div><span class="lab" style="left:8px;top:4px">Entrée</span>
<div class="band" style="left:180px;top:0;width:460px;height:150px"></div><span class="lab" style="left:188px;top:4px">Services</span>
<div class="band" style="left:180px;top:160px;width:460px;height:60px;background:#f7f6f5"></div><span class="lab" style="left:188px;top:164px">Stockage</span>
<svg width="640" height="220" fill="none">
<path d="M85 64 L85 86" stroke="#1c1917" stroke-width="2"/>
<path class="flow" d="M160 108 L200 108" stroke="#1c1917" stroke-width="2.75" stroke-dasharray="8 6"/>
<path d="M160 42 C180 42 180 42 200 42" stroke="#92400e" stroke-width="2"/>
<path class="flow" d="M350 108 L420 108" stroke="#57534e" stroke-width="2.25" stroke-dasharray="6 4"/>
<path d="M275 130 L275 176" stroke="#57534e" stroke-width="3.5" stroke-dasharray="2 3"/>
<path d="M570 198 L600 198" stroke="#78716c" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/>
</svg>
<div class="n" style="left:10px;top:20px;border-radius:9999px">Internet<small>cloud.example.com</small></div>
<div class="n" style="left:10px;top:86px">Proxy<small>HTTPS 443</small></div>
<div class="n w" style="left:200px;top:20px">turn<small>direct · 3478</small></div>
<div class="n on" style="left:200px;top:86px">nextcloud<small>public · 2 copies</small></div>
<div class="n" style="left:420px;top:86px">db<small>répliquée</small></div>
<div class="n" style="left:200px;top:176px;background:var(--color-canvas)">fichiers<small>partagé · 50 Go</small></div>
</div></body></html>
